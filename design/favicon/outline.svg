<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>coffee — outlined cup</title>
  <rect width="32" height="32" fill="#000000"/>
  <!-- The outline survives only if the interior stays big enough not to fill
       in, so the cup is drawn as large as the tile allows and the coffee is a
       single band rather than a filled half. -->
  <path d="M5 11h14v14H5z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="7" y="15" width="10" height="2" fill="#ffffff"/>
  <path d="M19 15h6v6h-6" fill="none" stroke="#ffffff" stroke-width="2"/>
</svg>
