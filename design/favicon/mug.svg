<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>coffee — mug</title>
  <rect width="32" height="32" fill="#000000"/>
  <!-- Solid silhouette, not an outline. At 16px an outlined cup collapses into
       a white block with a slot in it, so the mass is the mark and the only
       negative space is the handle's hole, which is what says "cup". -->
  <path d="M6 11h12v14H6z" fill="#ffffff"/>
  <path d="M18 15h7v7h-7" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Steam reads at 32px and fades to a hint at 16px; without it the
       silhouette can pass for a bucket. -->
  <rect x="8" y="4" width="2" height="5" fill="#ffffff"/>
  <rect x="14" y="4" width="2" height="5" fill="#ffffff"/>
</svg>
